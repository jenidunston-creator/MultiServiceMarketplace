{% extends "base.html" %}
{% block title %}Delete Service | Servana{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="container">
        <div class="auth-card text-center">
            <div style="font-size:3rem;" aria-hidden="true">🗑️</div>
            <h1 class="h3">Delete this service?</h1>
            <p class="text-muted">You are about to delete <strong>{{ listing.service.name }}</strong>. This cannot be undone.</p>

            <form method="post" action="">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button class="btn btn-danger-soft" type="submit">Yes, delete</button>
                    <a class="btn btn-outline-custom" href="{% url 'service_detail' listing.pk %}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
