{% extends "base.html" %}
{% block title %}Password changed | Servana{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="container">
        <div class="auth-card text-center">
            <div style="font-size:3rem;" aria-hidden="true">✅</div>
            <h1 class="h3">Your password was changed</h1>
            <p class="text-muted">You can now log in with your new password.</p>
            <a class="btn btn-primary-custom" href="{% url 'login' %}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
